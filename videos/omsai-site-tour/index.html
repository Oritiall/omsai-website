<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0B2447;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hero"
        class="scene"
        data-composition-id="01-hero"
        data-composition-src="compositions/frames/01-hero.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-ai-native"
        class="scene"
        data-composition-id="02-ai-native"
        data-composition-src="compositions/frames/02-ai-native.html"
        data-start="5"
        data-duration="6.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-comparison"
        class="scene"
        data-composition-id="03-comparison"
        data-composition-src="compositions/frames/03-comparison.html"
        data-start="11"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-services"
        class="scene"
        data-composition-id="04-services"
        data-composition-src="compositions/frames/04-services.html"
        data-start="18"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-closing"
        class="scene"
        data-composition-id="05-closing"
        data-composition-src="compositions/frames/05-closing.html"
        data-start="24"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hero", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-ai-native", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 5);
        tl.to("#el-02-ai-native", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 11);
        tl.fromTo("#el-03-comparison", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 11);
        tl.to("#el-03-comparison", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-services", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-04-services", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-05-closing", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
