      overflow: hidden;

    /* full-bleed ground — a dedicated clip layer, never painted on #root itself */
    .oh1-bg {
      position: absolute;

        radial-gradient(ellipse 70% 44% at 50% 24%, rgba(0, 191, 179, 0.10), rgba(0, 191, 179, 0) 68%),

    /* light plate behind the mark — the logo's wordmark is dark navy/black and reads as
       intended on the site's light nav bar; on this dark canvas it needs the same light

    .oh1-logo-plate {

  <div class="clip oh1-logo-stage" id="oh1-logo-stage" data-start="0" data-duration="5.5" data-track-index="1">

  <!-- Scene 2 (1.8-5.0s): hard cut — tagline enters below the logo, line-by-line stagger, holds -->
  <div class="clip oh1-tag-stage" id="oh1-tag-stage" data-start="1.8" data-duration="3.7" data-track-index="2">
    <div class="oh1-accent-line" id="oh1-accent-line"></div>
    <p class="oh1-tag-line oh1-tag-line-hero" id="oh1-line-1" dir="ltr">AI Native.</p>
    <p class="oh1-tag-line oh1-tag-line-mid" id="oh1-line-2" dir="rtl">מהיסוד.</p>
    <p class="oh1-tag-line oh1-tag-line-sub" id="oh1-line-3" dir="rtl">לעסקים קטנים ובינוניים.</p>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      var glow = document.getElementById('oh1-glow');

      // Logo: smooth long-tail spring-pop settle, no bounce — hero fully landed by t=0.42s (<=0.5s floor).
      tl.fromTo(
        '#oh1-logo',
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: 'power3.out' },
        0
      );

      // Ambient glow bloom — lands with the logo's settle as one beat.
      tl.fromTo(
        '#oh1-glow',
        { opacity: 0, scale: 0.85 },
        { opacity: 0.3, scale: 1, duration: 0.42, ease: 'power2.out' },
        0
      );

      // Bounded idle breathe during the Scene-1 hold — finite phase tween, not a yoyo loop.
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * 0.4,
          duration: 1.38,
          ease: 'none',
          onUpdate: function () {
            var s = Math.sin(phase.p);
            glow.style.opacity = String(0.3 + s * 0.03);
            glow.style.transform = 'scale(' + (1 + s * 0.02) + ')';
          },
        },
        0.42
      );

      // Hard cut into Scene 2 at 1.8s — instant, no transition entry (seam is a tl.set, not a tween).
      tl.set('#oh1-accent-line', { opacity: 1 }, 1.8);

      // Tagline: per-line staggered reveal, spread across the Scene-2 window, then holds static.
      tl.fromTo(
        '#oh1-line-1',
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        1.9
      );
      tl.fromTo(
        '#oh1-line-2',
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        2.7
      );
      tl.fromTo(
        '#oh1-line-3',
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        3.6
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['01-hero'] = tl;
    })();
