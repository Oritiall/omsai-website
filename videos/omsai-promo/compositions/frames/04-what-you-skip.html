    (function () {
      var tl = gsap.timeline({ paused: true });

      // Shared beat mechanics: per-word chunk-reveal → teal accent-underline burst (draw-on

      // beats) or a quiet settle that holds to the frame's end (the final beat — Frame 5's
      // crossfade dissolves it into the brand answer, so no exit is authored here).
      function buildBeat(idx, t0, wordCount, isFinal) {
        var wordsSel = '#wys-words' + idx + ' .wys-word';
        var underlineSel = '#wys-underline' + idx;
        var beatSel = '#wys-beat' + idx;

        var wordStagger = 0.06;
        var wordDur = 0.32;

        tl.fromTo(
          wordsSel,
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: wordDur, ease: 'power2.out', stagger: wordStagger },
          t0
        );

        var wordsEnd = t0 + (wordCount - 1) * wordStagger + wordDur;
        var underlineStart = wordsEnd + 0.04;
        var drawDur = 0.26;

        tl.fromTo(
          underlineSel,
          { scaleX: 0 },
          { scaleX: 1, duration: drawDur, ease: 'back.out(2.4)' },
          underlineStart
        );

        var pulse1Start = underlineStart + drawDur;
        var pulse1Dur = 0.10;
        var pulse2Dur = 0.14;

        tl.fromTo(
          underlineSel,
          { scaleY: 1 },
          { scaleY: 2.2, duration: pulse1Dur, ease: 'power1.out' },
          pulse1Start
        );
        tl.to(underlineSel, { scaleY: 1, duration: pulse2Dur, ease: 'power2.out' }, pulse1Start + pulse1Dur);

        var pulse2End = pulse1Start + pulse1Dur + pulse2Dur;

        if (!isFinal) {
          var exitStart = pulse2End + 0.12;
          tl.to(
            [wordsSel, underlineSel],
            { x: -42, opacity: 0, duration: 0.28, ease: 'power2.in' },
            exitStart
          );
        } else {
          var settleStart = pulse2End + 0.26;
          tl.to(
            beatSel,
            { scale: 1.015, duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 1 },
            settleStart
          );
        }
      }

      buildBeat(2, 1.5, 3, false);
      buildBeat(3, 3.0, 4, true);
