<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0B2447;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hype-list"
        class="scene"
        data-composition-id="01-hype-list"
        data-composition-src="compositions/frames/01-hype-list.html"
        data-start="0"
        data-duration="5.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-you-dont-need-it"
        class="scene"
        data-composition-id="02-you-dont-need-it"
        data-composition-src="compositions/frames/02-you-dont-need-it.html"
        data-start="5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-work-for-you"
        class="scene"
        data-composition-id="03-work-for-you"
        data-composition-src="compositions/frames/03-work-for-you.html"
        data-start="9"
        data-duration="4.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-what-you-skip"
        class="scene"
        data-composition-id="04-what-you-skip"
        data-composition-src="compositions/frames/04-what-you-skip.html"
        data-start="13"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-brand-intro"
        class="scene"
        data-composition-id="05-brand-intro"
        data-composition-src="compositions/frames/05-brand-intro.html"
        data-start="18"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cost-stat"
        class="scene"
        data-composition-id="06-cost-stat"
        data-composition-src="compositions/frames/06-cost-stat.html"
        data-start="23"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-closing"
        class="scene"
        data-composition-id="07-closing"
        data-composition-src="compositions/frames/07-closing.html"
        data-start="27"
        data-duration="5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hype-list", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5);
        tl.fromTo("#el-02-you-dont-need-it", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5);
        tl.to("#el-02-you-dont-need-it", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-work-for-you", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.to("#el-03-work-for-you", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 13);
        tl.fromTo("#el-04-what-you-skip", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 13);
        tl.to("#el-04-what-you-skip", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-05-brand-intro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18);
        tl.to("#el-05-brand-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-06-cost-stat", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-06-cost-stat", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-07-closing", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.to({}, { duration: 32 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
